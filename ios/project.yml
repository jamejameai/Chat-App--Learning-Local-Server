name: MiniTelegram
options:
  bundleIdPrefix: com.minitelegram
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    # Ad-hoc "Sign to Run Locally". The Simulator only grants Keychain access to
    # signed apps; unsigned builds fail with errSecMissingEntitlement (-34018).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_PREVIEWS: "YES"

packages:
  # Real voice/video calls (WebRTC) through the LiveKit server
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.18.0

targets:
  MiniTelegram:
    type: application
    platform: iOS
    sources:
      - path: MiniTelegram
    dependencies:
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minitelegram.ios
        CODE_SIGN_IDENTITY: "-" # overrides XcodeGen's "iPhone Developer" preset
        INFOPLIST_FILE: MiniTelegram/Configuration/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MiniTelegramTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES" # signed bundles need an Info.plist
    dependencies:
      - target: MiniTelegram
