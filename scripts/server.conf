# Our Chat home server — the one place its address lives.
# Read by run.sh, scripts/deploy-lan.sh and scripts/install_device.sh.
#
# When the server's Wi-Fi address changes, run:
#     bash scripts/set-server.sh <new-ip>
# (it checks the address really is this server, updates this file and redeploys).
# Environment variables still win for one-off runs: OURCHAT_SERVER=user@host ./run.sh

OURCHAT_SERVER_USER=jj_home_lap
OURCHAT_SERVER_HOST=100.78.0.52
# Public https address of the same server (Tailscale Funnel, 443 -> localhost:3001): works from any
# network without Tailscale on the phone. The app uses it first; calls still go to OURCHAT_SERVER_HOST.
OURCHAT_PUBLIC_URL=https://jjserver.tail87c566.ts.net

# SSH host key of the server (ED25519). set-server.sh refuses any address whose key differs,
# so a new IP can never silently point the app at a different machine.
OURCHAT_SERVER_HOSTKEY=SHA256:6qcQTIkQ9vvM4srNFVgIDadQsrW0WnQeW0oy35+eTDY
